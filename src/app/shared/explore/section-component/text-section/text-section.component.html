<ng-container [ngSwitch]="textRowSection?.contentType">
  <div *ngSwitchCase="'image'"><img [src]="textRowSection.content" style="width: 100%"></div>
  <div *ngSwitchCase="'text-key'">{{ ('explore.text-section.' + textRowSection.content) | translate }}</div>
  <div *ngSwitchCase="'text-raw'">{{ textRowSection.content }}</div>
  <div *ngSwitchCase="'text-metadata'" class="p-2 border rounded" [class.text-section-home-news]="textRowSection.content === 'cris.cms.home-news'">
    <ds-markdown-viewer data-test="ds-markdown-viewer"
                        [value]="metadataValue(textRowSection.content)"></ds-markdown-viewer>
  </div>
  <div *ngSwitchCase="'custom'">
    <ng-container *ngTemplateOutlet="custom"></ng-container>
  </div>
  <div *ngSwitchCase="'submit-section'">
    <ng-container>
      <ng-container *ngTemplateOutlet="submitSection"></ng-container>
    </ng-container>
  </div>
</ng-container>

<!-- Custom content type -->
<ng-template #submitSection>
  <div class="d-flex flex-column align-items-center">
    <div class="card p-2 my-2">
      <div class="d-flex flex-row justify-content-center gap-2">
        <a routerLink="../mydspace" class="btn btn-primary upload-button">
          <i class="icon icon-right epfl-upload"></i>
          {{'explore.submit-section.new-submission' | translate }}
        </a>
        <a href="https://help-infoscience.epfl.ch"
           class="btn btn-outline-secondary help-button d-flex align-items-center gap-1"
           target="_blank" rel="noreferrer noopener">
          <i class="fas fa-question-circle"></i>
          {{'footer.link.help' | translate }}
        </a>
      </div>
    </div>
  </div>
</ng-template>


<!-- Custom content type -->
<ng-template #custom></ng-template>
